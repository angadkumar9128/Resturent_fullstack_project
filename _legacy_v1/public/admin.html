<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Spice Garden</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <a href="index.html" class="logo">🍛 Spice Garden · Admin</a>
    <nav><button id="logoutBtn" class="btn btn-small btn-ghost" hidden>Log out</button></nav>
  </header>

  <!-- Login -->
  <div id="loginView" class="login-box">
    <h2>Admin Login</h2>
    <form id="loginForm" class="form">
      <input name="username" placeholder="Username" autocomplete="username" required />
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button class="btn" type="submit">Log in</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashView" class="admin-wrap" hidden>
    <div id="stats" class="stats"></div>

    <div class="admin-tabs">
      <button class="tab active" data-view="orders">Orders</button>
      <button class="tab" data-view="reservations">Reservations</button>
      <button class="tab" data-view="menu">Menu</button>
    </div>

    <section id="ordersView"></section>
    <section id="reservationsView" hidden></section>
    <section id="menuView" hidden></section>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
