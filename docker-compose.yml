services:
  db:
    image: postgres:16-alpine
    container_name: spice-garden-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spice
      POSTGRES_PASSWORD: spice_local_pw
      POSTGRES_DB: spice_garden
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
